<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria com efeito fumê</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <div class="galeria">
      <!-- Os botões permitem selecionar as imagens pelo teclado. -->
      <button type="button" aria-label="Ampliar imagem de água-viva">
        <img src="imagens/img1.png" alt="Fundo do mar">
      </button>


      <button type="button" aria-label="Ampliar imagem de coala">
        <img src="imagens/img2.png" alt="Animal fofo">
      </button>


      <button type="button" aria-label="Ampliar paisagem de deserto">
        <img src="imagens/img3.png" alt="Deserto com montanha">
      </button>


      <button type="button" aria-label="Ampliar flores em um lago">
        <img src="imagens/img4.png" alt="Lago com flores rosa">
      </button>


      <button type="button" aria-label="Ampliar casas próximas ao lago">
        <img src="imagens/img5.png" alt="Casa aconchegante a beira do lago">
      </button>


      <button type="button" aria-label="Ampliar rio com árvores">
        <img src="imagens/img6.png" alt="Paisagem da natureza com rio">
      </button>

      <button type="button" aria-label="Ampliar imagem de coala">
        <img src="imagens/download.png" alt="Árvore com um balanço">
      </button>

      <button type="button" aria-label="Ampliar imagem de coala">
        <img src="imagens/flor.jpg" alt="Flores rosas no quintal da casa">
      </button>
    </div>
  </main>


  <!-- Janela que apresenta a imagem ampliada. -->
  <dialog class="ampliacao" aria-label="Imagem ampliada">
    <button class="fechar" type="button"
      aria-label="Fechar imagem ampliada">
      &times;
    </button>


    <img class="imagem-ampliada" alt="">
  </dialog>
 
  <script src="script.js"></script>
</body>
</html>
